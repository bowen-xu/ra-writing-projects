[package]
name = "research-writing-projects-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Canonical read-only writing import inspection and its finite native host"

[[bin]]
name = "writing-projects-host"
path = "src/main.rs"

[dependencies]
biblatex = "=0.12.0"
regex = "1"
research-agent-core = { path = "../../../packages/agent-core" }
research-workbench-native-sdk = { path = "../../../packages/workbench-native-sdk" }
research-note-query = { path = "../../../packages/note-query" }
sha2 = "0.10"
serde = "1"
serde_json = "1"
libc = "0.2"
thiserror = "2"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
uuid = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
